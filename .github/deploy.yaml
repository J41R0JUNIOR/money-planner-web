name: Deploy Frontend

on:
  push:
    branches:
      - main
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Build React
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        working-directory: infra
        run: terraform init


      - name: Terraform Validate
        working-directory: infra
        run: terraform validate


      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve


      - name: Deploy Frontend to S3
        run: |
          aws s3 sync dist/ \
          s3://$(terraform -chdir=infra output -raw bucket_name) \
          --delete \
          --region us-east-1


      - name: CloudFront Cache Invalidation
        run: |
          aws cloudfront create-invalidation \
          --distribution-id $(terraform -chdir=infra output -raw cloudfront_distribution_id) \
          --paths "/*"